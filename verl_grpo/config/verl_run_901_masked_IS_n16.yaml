# ============================================================================
# Run 901_masked_IS_n16: Offline Prefix + Prompt Masking + IS, n=16 rollout
# ============================================================================
# Parent: run 901_masked_IS (offline prefix + masking + IS, n=8, 4-GPU TP=1)
# Change: n=8 -> n=16, TP=1 -> TP=2
# No batch size changes (if OOM, adjust later)
#
# Model:    Qwen2.5-7B-Instruct + LoRA (rank=64, alpha=128)
# Dataset:  Offline augmented ExtremeHard 595 with prefix fraction cascade
#           ~536 original rows + ~460-510 guided rows = ~1000-1050 train rows
# GPUs:     4x A100 40GB (FSDP + vLLM TP=2)
# Epochs:   4
# Mode:     prompt_masked — rollouts use augmented prompts from parquet,
#           but Hook 1 swaps guided rows to original prompt before training.
#           Per-token IS correction applied to fix distribution mismatch.
# ============================================================================

defaults:
  - ppo_trainer_7b
  - _self_

trainer:
  experiment_name: verl_grpo_run901_masked_IS_n16
  total_epochs: 4
  n_gpus_per_node: 4

data:
  train_files: verl_grpo/data_offline_guided_prefix/train.parquet
  val_files: verl_grpo/data_offline_guided_prefix/val.parquet
  train_batch_size: 32
  max_prompt_length: 4096

actor_rollout_ref:
  model:
    lora_dropout: 0.05
  actor:
    ppo_epochs: 1
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
  ref:
    log_prob_micro_batch_size_per_gpu: 16
  rollout:
    n: 16
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.6
    log_prob_micro_batch_size_per_gpu: 16

hints:
  enabled: true
  hint_mode: prompt_masked
  prompt_mode: original
  compute_is_ratio: true
  is_correction_mode: per_token
  is_correction_clamp_min: 0.01

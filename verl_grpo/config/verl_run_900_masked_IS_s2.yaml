# ============================================================================
# Run 900_masked_IS_s2: Offline Hint Augmented + Prompt Masking + IS Correction
# ============================================================================
# Model:    Qwen2.5-7B-Instruct + LoRA (rank=64, alpha=128)
# Dataset:  Offline augmented ExtremeHard 595 with L1-L5 hint cascade
#           ~536 original rows + ~420-480 guided rows = ~960-1010 train rows
# GPUs:     4x A100 40GB (FSDP + vLLM, TP=1)
# Epochs:   4
# Mode:     prompt_masked — rollouts use augmented prompts from parquet,
#           but Hook 1 swaps guided rows to original prompt before training.
#           Per-token IS correction applied to fix distribution mismatch:
#           w_t = π_old(y_t|x) / π_old(y_t|x̃), clamped to [0.01, 1.0].
# Comparison:
#   run 900         — same data, vanilla GRPO (no masking, no IS)
#   run 900_masked  — same but without IS correction
#   run 853         — online hierarchical2 + IS, 4-GPU
# ============================================================================
# Seed variant: seed=123

defaults:
- ppo_trainer_7b
- _self_
trainer:
  experiment_name: verl_grpo_run900_masked_IS_s2
  total_epochs: 4
  n_gpus_per_node: 4
  seed: 123
data:
  train_files: verl_grpo/data_offline_guided_hint/train.parquet
  val_files: verl_grpo/data_offline_guided_hint/val.parquet
  train_batch_size: 32
  max_prompt_length: 4096
actor_rollout_ref:
  model:
    lora_dropout: 0.05
  actor:
    ppo_epochs: 1
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
  ref:
    log_prob_micro_batch_size_per_gpu: 16
  rollout:
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    log_prob_micro_batch_size_per_gpu: 16
    seed: 123
hints:
  enabled: true
  hint_mode: prompt_masked
  prompt_mode: original
  compute_is_ratio: true
  is_correction_mode: per_token
  is_correction_clamp_min: 0.01

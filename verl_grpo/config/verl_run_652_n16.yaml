# ============================================================
# veRL Run 652_n16: Vanilla GRPO, n=16 rollout, 4-GPU, Extreme Hard (0/64)
# ============================================================
# Parent: run 652 (vanilla GRPO, n=8, 2-GPU)
# Change: n=8 -> n=16 rollout trajectories per prompt
# No batch size changes (if OOM, adjust later)
#
# Model: Qwen/Qwen2.5-7B-Instruct + LoRA (rank=64, alpha=128)
# Dataset: Extreme Hard — 595 MATH problems with 0/64 correct
# GPUs: 4x A100 40GB (FSDP + vLLM TP=2)
# n=16 trajectories per prompt, 4 epochs, ppo_epochs=1
# No KL penalty, no hints (vanilla GRPO)
#
# Batch math:
#   train_batch_size=32, n=16 -> 512 sequences/step
#   steps_per_epoch = 536 / 32 = 16
#   total_steps = 16 x 4 = 64
# ============================================================

defaults:
  - ppo_trainer_7b
  - _self_

trainer:
  experiment_name: verl_grpo_run652_n16
  total_epochs: 4
  n_gpus_per_node: 4

data:
  train_files: verl_grpo/data_extremehard_595/train.parquet
  val_files: verl_grpo/data_extremehard_595/val.parquet
  train_batch_size: 32

actor_rollout_ref:
  model:
    lora_dropout: 0.05
  actor:
    ppo_epochs: 1
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
  ref:
    log_prob_micro_batch_size_per_gpu: 16
  rollout:
    n: 16
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.6
    log_prob_micro_batch_size_per_gpu: 16

hints:
  enabled: false

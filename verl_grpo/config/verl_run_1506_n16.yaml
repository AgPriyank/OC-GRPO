# n=16 rollout variant of 954 (Qwen2.5-1.5B)
defaults:
  - ppo_trainer_7b
  - _self_

trainer:
  experiment_name: verl_grpo_run1506_n16
  total_epochs: 4
  n_gpus_per_node: 2

data:
  train_files: verl_grpo/data_offline_guided_qwen1_5b_prefix/train.parquet
  val_files: verl_grpo/data_offline_guided_qwen1_5b_prefix/val.parquet
  train_batch_size: 32
  max_prompt_length: 4096

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct
    lora_dropout: 0.05
  actor:
    ppo_epochs: 1
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    entropy_from_logits_with_chunking: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  ref:
    fsdp_config:
      param_offload: false
    log_prob_micro_batch_size_per_gpu: 16
  rollout:
    n: 16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    log_prob_micro_batch_size_per_gpu: 16

hints:
  enabled: false
